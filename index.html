<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dekhoo - Live TV & Sports Hub</title>
    <link rel="icon" type="image/png" href="https://files.catbox.moe/6z7gmt.png">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-top: 0px; 
            margin-bottom: 25px; /* হোম বাটন থেকে দূরত্ব বাড়ানোর জন্য মার্জিন সামান্য বাড়ানো হলো */
            position: relative;
        }
        .dekhoo-link {
            display: inline-block;
            cursor: pointer;
            text-decoration: none;
            align-self: flex-start;
        }
        h1 {
            color: #ff4757;
            font-size: 3.2rem;
            font-weight: 900;
            margin: 0px;
            letter-spacing: 1.5px;
            text-align: left;
        }
        .subtitle {
            color: #f1f2f6;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: -38px;
            margin-bottom: 0;
            pointer-events: none;
        }
        .category-nav {
            display: flex;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto 20px auto;
            width: 100%;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .cat-btn:hover, .cat-btn.active {
            background: #ff4757;
            border-color: #ff4757;
        }
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
        }
        .player-section {
            flex: 2;
            min-width: 300px;
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            width: 100%;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #current-playing {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #2ed573;
            font-weight: bold;
        }
        .sidebar {
            flex: 1;
            min-width: 280px;
            background: #161b22;
            border-radius: 12px;
            padding: 15px;
            max-height: 550px;
            display: flex;
            flex-direction: column;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #ffffff;
            font-size: 1rem;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .channel-list {
            overflow-y: auto;
            flex-grow: 1;
        }
        .channel-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #21262d;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .channel-item:hover {
            background: #30363d;
            color: #ff4757;
        }
        .channel-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            background: #8b949e;
        }
        .status-dot.green {
            background: #2ed573;
            box-shadow: 0 0 6px #2ed573;
        }
        .status-dot.red {
            background: #ff4757;
            box-shadow: 0 0 6px #ff4757;
        }
        #status {
            margin-top: 10px;
            color: #f39c12;
            font-size: 13px;
        }
        footer {
            text-align: center;
            padding: 20px 0 10px 0;
            color: #8b949e;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border-top: 1px solid #21262d;
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <header>
            <div class="dekhoo-link" onclick="goHome()">
                <h1>Dekhoo</h1>
            </div>
            <div class="subtitle">Live TV & Sports Hub</div>
        </header>
    </div>

    <!-- ক্যাটাগরি ন্যাভবার -->
    <div class="category-nav">
        <button class="cat-btn active" id="homeBtn" onclick="filterCategory('home', this)">Home</button>
        <button class="cat-btn" onclick="filterCategory('news', this)">News</button>
        <button class="cat-btn" onclick="filterCategory('sports', this)">Sports</button>
        <button class="cat-btn" onclick="filterCategory('entertainment', this)">Entertainment</button>
        <button class="cat-btn" onclick="filterCategory('cartoon', this)">Kids Zone</button>
    </div>

    <div class="main-container">
        <!-- ভিডিও প্লেয়ার সেকশন -->
        <div class="player-section">
            <div class="video-container">
                <div id="overlay-msg">Please select a channel</div>
                <video id="player" controls autoplay></video>
            </div>
            <div id="current-playing">No channel selected</div>
            <div id="status">Loading channels...</div>
        </div>

        <!-- চ্যানেল লিস্ট ও সার্চ সেকশন -->
        <div class="sidebar">
            <input type="text" id="searchBox" class="search-box" placeholder="Search any channel..." onkeyup="applyCurrentView()">
            <div class="channel-list" id="channelList"></div>
        </div>
    </div>

    <footer>
        Powered By MOBIX
    </footer>

    <script>
        const video = document.getElementById('player');
        const channelListDiv = document.getElementById('channelList');
        const statusDiv = document.getElementById('status');
        const currentPlayingDiv = document.getElementById('current-playing');
        const searchBox = document.getElementById('searchBox');
        const overlayMsg = document.getElementById('overlay-msg');
        const homeBtn = document.getElementById('homeBtn');

        const playlistUrl = 'https://iptv-org.github.io/iptv/index.m3u';

        let allChannels = [];
        let currentCategory = 'home';
        let hlsInstance = null;
        let loadTimeout = null;

        function goHome() {
            searchBox.value = '';
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            homeBtn.classList.add('active');
            filterCategory('home', homeBtn);
        }

        async function loadAllData() {
            statusDiv.innerText = "Loading channels from playlist...";
            try {
                const response = await fetch(playlistUrl);
                const data = await response.text();
                const lines = data.split('\n');
                let list = [];
                let currentName = '';

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        let parts = line.split(',');
                        if (parts.length > 1) {
                            currentName = parts[parts.length - 1].trim();
                        }
                    } else if (line.startsWith('http')) {
                        if (currentName) {
                            if (!currentName.toLowerCase().includes('[geo-blocked]')) {
                                list.push({ name: currentName, url: line, status: null });
                            }
                            currentName = '';
                        }
                    }
                }

                allChannels = list;
                allChannels.sort((a, b) => a.name.localeCompare(b.name));
                
                applyCurrentView();
                statusDiv.innerText = `Loaded ${allChannels.length} channels. Checking status...`;
                
                checkAllChannelsInBackground();

            } catch (err) {
                console.error("Playlist parse error:", err);
                statusDiv.innerText = "Failed to load channels.";
            }
        }

        async function checkAllChannelsInBackground() {
            const batchSize = 10;
            let checkedCount = 0;

            for (let i = 0; i < allChannels.length; i += batchSize) {
                let batch = allChannels.slice(i, i + batchSize);
                
                await Promise.all(batch.map(async (channel) => {
                    if (channel.status !== null) return;
                    try {
                        let controller = new AbortController();
                        let timeoutId = setTimeout(() => controller.abort(), 4000);
                        
                        await fetch(channel.url, { method: 'GET', mode: 'no-cors', signal: controller.signal });
                        clearTimeout(timeoutId);
                        channel.status = true;
                    } catch (e) {
                        channel.status = false;
                    }
                    checkedCount++;
                }));

                updateVisibleDots();
                
                if (checkedCount >= 500) {
                    break;
                }
            }
            statusDiv.innerText = `Loaded total ${allChannels.length} channels.`;
        }

        function updateVisibleDots() {
            let items = channelListDiv.querySelectorAll('.channel-item');
            let currentList = getFilteredList();
            
            items.forEach((item, index) => {
                if (currentList[index]) {
                    let dot = item.querySelector('.status-dot');
                    if (dot) {
                        if (currentList[index].status === true) {
                            dot.className = 'status-dot green';
                        } else if (currentList[index].status === false) {
                            dot.className = 'status-dot red';
                        }
                    }
                }
            });
        }

        function filterCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            applyCurrentView();
        }

        function getFilteredList() {
            let list = allChannels;

            if (currentCategory === 'news') {
                list = list.filter(c => {
                    let n = c.name.toLowerCase();
                    return n.includes('news') || n.includes('somoy') || n.includes('independant') || n.includes('jamuna') || n.includes('24') || n.includes('bbc') || n.includes('cnn') || n.includes('reuters');
                });
            } else if (currentCategory === 'sports') {
                list = list.filter(c => {
                    let n = c.name.toLowerCase();
                    return n.includes('sport') || n.includes('cricket') || n.includes('football') || n.includes('t sports') || n.includes('ten') || n.includes('espn') || n.includes('fox');
                });
            } else if (currentCategory === 'entertainment') {
                list = list.filter(c => {
                    let n = c.name.toLowerCase();
                    return n.includes('tv') || n.includes('movie') || n.includes('drama') || n.includes('entertainment') || n.includes('music') || n.includes('show') || n.includes('bangla') || n.includes('hbo') || n.includes('star');
                });
            } else if (currentCategory === 'cartoon') {
                list = list.filter(c => {
                    let n = c.name.toLowerCase();
                    return n.includes('cartoon') || n.includes('kids') || n.includes('disney') || n.includes('nick') || n.includes('pogo') || n.includes('anime');
                });
            }

            let query = searchBox.value.toLowerCase().trim();
            if (query !== '') {
                list = list.filter(c => c.name.toLowerCase().includes(query));
            }

            return list;
        }

        function displayChannels(list) {
            channelListDiv.innerHTML = '';
            const displayList = list.slice(0, 500);
            
            if (displayList.length === 0) {
                channelListDiv.innerHTML = '<div style="text-align:center; color:#8b949e; padding:15px;">No channels found.</div>';
                return;
            }

            displayList.forEach(channel => {
                let div = document.createElement('div');
                div.className = 'channel-item';
                
                let dotClass = 'status-dot';
                if (channel.status === true) dotClass += ' green';
                else if (channel.status === false) dotClass += ' red';

                div.innerHTML = `
                    <span class="channel-name" title="${channel.name}">${channel.name}</span>
                    <span class="${dotClass}"></span>
                `;
                
                div.onclick = () => playChannel(channel, div.querySelector('.status-dot'));
                channelListDiv.appendChild(div);
            });

            if(list.length > 500) {
                let infoDiv = document.createElement('div');
                infoDiv.style.textAlign = "center";
                infoDiv.style.color = "#8b949e";
                infoDiv.style.fontSize = "12px";
                infoDiv.style.padding = "8px";
                infoDiv.innerText = `Showing first 500 of ${list.length}. Use search to find more.`;
                channelListDiv.appendChild(infoDiv);
            }
        }

        function applyCurrentView() {
            let list = getFilteredList();
            displayChannels(list);
        }

        loadAllData();

        function playChannel(channel, dotElement) {
            currentPlayingDiv.innerText = "Playing: " + channel.name;
            
            overlayMsg.innerText = "Loading...";
            overlayMsg.style.display = 'flex';

            if (loadTimeout) clearTimeout(loadTimeout);

            loadTimeout = setTimeout(() => {
                if (overlayMsg.style.display === 'flex' && overlayMsg.innerText === "Loading...") {
                    overlayMsg.innerText = "Unavailable";
                    channel.status = false;
                    if (dotElement) dotElement.className = 'status-dot red';
                }
            }, 8000);

            if (hlsInstance) {
                hlsInstance.destroy();
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    liveSyncDurationCount: 3
                });
                
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    if (loadTimeout) clearTimeout(loadTimeout);
                    overlayMsg.style.display = 'none';
                    channel.status = true;
                    if (dotElement) dotElement.className = 'status-dot green';
                    video.play().catch(e => console.log("Autoplay blocked"));
                });

                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        if (loadTimeout) clearTimeout(loadTimeout);
                        overlayMsg.innerText = "Unavailable";
                        overlayMsg.style.display = 'flex';
                        channel.status = false;
                        if (dotElement) dotElement.className = 'status-dot red';
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    if (loadTimeout) clearTimeout(loadTimeout);
                    overlayMsg.style.display = 'none';
                    channel.status = true;
                    if (dotElement) dotElement.className = 'status-dot green';
                    video.play();
                });
                video.addEventListener('error', function() {
                    if (loadTimeout) clearTimeout(loadTimeout);
                    overlayMsg.innerText = "Unavailable";
                    overlayMsg.style.display = 'flex';
                    channel.status = false;
                    if (dotElement) dotElement.className = 'status-dot red';
                });
            }
        }
    </script>
</body>
</html>
